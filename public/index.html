<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Council</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #101210; color: #edf0e9; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
      main { width: min(680px, calc(100% - 48px)); padding: 80px 0; }
      .label { color: #abc4a0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
      h1 { font-weight: 500; font-size: clamp(58px, 12vw, 108px); letter-spacing: -.065em; margin: 22px 0; }
      p { color: #aeb5aa; max-width: 510px; line-height: 1.65; font-size: 18px; }
      .status { margin-top: 56px; padding-top: 24px; border-top: 1px solid #30362c; font-size: 13px; }
      output { display: block; margin-top: 12px; color: #abc4a0; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Independent minds · one conversation</div>
      <h1>Council.</h1>
      <p>A workspace for comparing the world's leading AI models, side by side.</p>
      <p class="status">Infrastructure preview. The private AI dashboard is under construction.</p>
      <output id="health" aria-live="polite">Checking backend connection…</output>
    </main>
    <script type="module">
      const status = document.getElementById('health');
      try {
        const response = await fetch('/api/health', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
        const health = await response.json();
        if (!response.ok || health.status !== 'ok' || health.database !== 'connected') throw new Error();
        status.textContent = 'Cloudflare Worker and D1 connected.';
      } catch {
        status.textContent = 'Backend connection could not be verified. Try reloading.';
      }
    </script>
  </body>
</html>
